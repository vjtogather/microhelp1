<header class="site-header">
  <div class="wrap header-inner">
    <a href="{{ "/" | relURL }}" class="logo">
      <img src="{{ "images/brand/logo-full.png" | relURL }}" alt="" class="logo-mark-img">
      <span class="logo-text">Michro<em>Help</em></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="document.querySelector('.site-nav').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
