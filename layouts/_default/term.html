{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">{{ .Data.Singular | humanize }}</p>
    <h1>{{ .Title }}</h1>
  </div>
</section>
<section class="section">
  <div class="wrap">
    <div class="card-grid">
      {{ range .Pages }}
      <a class="card" href="{{ .RelPermalink }}">
        <div class="card-thumb">{{ partial "icon-post.html" . }}</div>
        <div class="card-body">
          <p class="card-meta">{{ .Date.Format "Jan 2, 2006" }}</p>
          <h3>{{ .Title }}</h3>
          <p>{{ .Summary | plainify | truncate 110 }}</p>
        </div>
      </a>
      {{ else }}
      <p>Nothing here yet — check back soon.</p>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
