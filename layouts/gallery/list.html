{{ define "main" }}
<section class="page-intro"><div class="wrap"><p class="eyebrow">WORKBENCH & SNAPSHOTS</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p></div></section>
<section class="content-section"><div class="wrap"><div class="gallery-grid">
{{ range .RegularPages.ByWeight }}<a class="gallery-tile" href="{{ .Params.image | relURL }}" target="_blank" rel="noopener">{{ with .Params.image }}<img src="{{ . | relURL }}" alt="{{ $.Params.alt | default $.Title }}" loading="lazy">{{ end }}<span>{{ .Title }}</span><small>{{ .Params.caption }}</small></a>{{ else }}<p>Gallery items will appear here when you publish them from the admin panel.</p>{{ end }}
</div></div></section>
{{ end }}
